; @@name@@ rice: polybar (generated by void-rice, edit palettes/@@rice@@.conf instead)
; Started per monitor by `rice bar` with MONITOR, BATTERY, ADAPTER and
; BACKLIGHT_CARD set from what the machine actually has.

[colors]
bg = @@bg@@
bg-alt = @@bg_alt@@
bg-hi = @@bg_hi@@
fg = @@fg@@
fg-dim = @@fg_dim@@
accent = @@accent@@
accent2 = @@accent2@@
urgent = @@urgent@@
good = @@good@@
info = @@info@@

[bar/main]
monitor = ${env:MONITOR:}
bottom = @@pb_bottom@@
width = @@pb_width@@
height = @@bar_h@@
offset-x = @@pb_offset@@
offset-y = @@pb_offset@@
radius = @@pb_radius@@
background = ${colors.bg}
foreground = ${colors.fg}
line-size = @@pb_line@@
border-size = @@pb_border@@
border-color = ${colors.bg-hi}
padding-left = 0
padding-right = 1
module-margin = 1
font-0 = "@@font_ui@@:size=@@font_size@@;3"
font-1 = "Symbols Nerd Font:size=@@font_size@@;3"
font-2 = "@@font_mono@@:size=@@font_size@@;3"
modules-left = launcher @@pb_ws_module@@ title
modules-center = date
modules-right = pulseaudio backlight wlan eth cpu memory battery tray powermenu
cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true
wm-restack = @@pb_wm_restack@@

[module/launcher]
type = custom/text
format = @@i_void@@
format-foreground = ${colors.bg}
format-background = ${colors.accent}
format-padding = 2
click-left = rice launch

[module/powermenu]
type = custom/text
format = @@i_power@@
format-foreground = ${colors.urgent}
format-padding = 1
click-left = rice power

; ---- workspace modules: the rice picks one via pb_ws_module ----------------
[module/i3]
type = internal/i3
pin-workspaces = true
index-sort = true
enable-scroll = false
format = <label-state> <label-mode>
label-mode = %mode%
label-mode-background = ${colors.accent2}
label-mode-foreground = ${colors.bg}
label-mode-padding = 1
label-focused = %name%
label-focused-background = @@pb_focus_bg@@
label-focused-foreground = @@pb_focus_fg@@
label-focused-underline = ${colors.accent}
label-focused-padding = 2
label-unfocused = %name%
label-unfocused-foreground = ${colors.fg-dim}
label-unfocused-padding = 2
label-visible = %name%
label-visible-padding = 2
label-urgent = %name%
label-urgent-background = ${colors.urgent}
label-urgent-foreground = ${colors.bg}
label-urgent-padding = 2

[module/bspwm]
type = internal/bspwm
pin-workspaces = true
enable-scroll = false
label-focused = %name%
label-focused-background = @@pb_focus_bg@@
label-focused-foreground = @@pb_focus_fg@@
label-focused-underline = ${colors.accent}
label-focused-padding = 2
label-occupied = %name%
label-occupied-padding = 2
label-urgent = %name%
label-urgent-background = ${colors.urgent}
label-urgent-foreground = ${colors.bg}
label-urgent-padding = 2
label-empty = %name%
label-empty-foreground = ${colors.fg-dim}
label-empty-padding = 2

[module/xworkspaces]
type = internal/xworkspaces
pin-workspaces = true
enable-scroll = false
label-active = %name%
label-active-background = @@pb_focus_bg@@
label-active-foreground = @@pb_focus_fg@@
label-active-underline = ${colors.accent}
label-active-padding = 2
label-occupied = %name%
label-occupied-padding = 2
label-urgent = %name%
label-urgent-background = ${colors.urgent}
label-urgent-foreground = ${colors.bg}
label-urgent-padding = 2
label-empty = %name%
label-empty-foreground = ${colors.fg-dim}
label-empty-padding = 2

[module/title]
type = internal/xwindow
label = %title:0:48:…%
label-foreground = ${colors.fg-dim}

[module/date]
type = internal/date
interval = 5
date = %H:%M
date-alt = %A, %d %B %Y
label = @@i_clock@@  %date%
label-foreground = ${colors.fg}

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = false
format-volume = <ramp-volume> <label-volume>
format-volume-foreground = ${colors.accent2}
label-volume = %percentage%%
label-muted = @@i_vol_off@@ muted
label-muted-foreground = ${colors.fg-dim}
ramp-volume-0 = @@i_vol_lo@@
ramp-volume-1 = @@i_vol_mid@@
ramp-volume-2 = @@i_vol_hi@@
click-right = pavucontrol

[module/backlight]
type = internal/backlight
card = ${env:BACKLIGHT_CARD:intel_backlight}
use-actual-brightness = true
enable-scroll = true
format = <label>
label = @@i_light@@ %percentage%%

[network-base]
type = internal/network
interval = 5
format-connected = <label-connected>
format-disconnected = <label-disconnected>
label-disconnected =

[module/wlan]
inherit = network-base
interface-type = wireless
label-connected = @@i_wifi@@ %essid%
label-connected-foreground = ${colors.good}

[module/eth]
inherit = network-base
interface-type = wired
label-connected = @@i_eth@@ wired
label-connected-foreground = ${colors.good}

[module/cpu]
type = internal/cpu
interval = 3
label = @@i_cpu@@ %percentage:2%%
label-foreground = ${colors.info}

[module/memory]
type = internal/memory
interval = 5
label = @@i_mem@@ %percentage_used:2%%
label-foreground = ${colors.info}

[module/battery]
type = internal/battery
battery = ${env:BATTERY:BAT0}
adapter = ${env:ADAPTER:AC}
full-at = 98
low-at = 15
format-charging = <label-charging>
format-discharging = <ramp-capacity> <label-discharging>
format-full = <ramp-capacity> <label-full>
format-low = <ramp-capacity> <label-low>
label-charging = @@i_bat_chg@@ %percentage%%
label-charging-foreground = ${colors.good}
label-discharging = %percentage%%
label-full = %percentage%%
label-low = %percentage%%
label-low-foreground = ${colors.urgent}
ramp-capacity-0 = @@i_bat_0@@
ramp-capacity-1 = @@i_bat_1@@
ramp-capacity-2 = @@i_bat_2@@
ramp-capacity-3 = @@i_bat_3@@
ramp-capacity-4 = @@i_bat_4@@

[module/tray]
type = internal/tray
tray-spacing = 8px
tray-size = 60%

[settings]
screenchange-reload = true
