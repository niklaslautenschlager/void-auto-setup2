# @@name@@ rice: picom (generated by void-rice, edit palettes/@@rice@@.conf instead)
# xrender works everywhere, including VMs without 3D acceleration.
backend = "xrender";
vsync = true;

shadow = true;
shadow-radius = 14;
shadow-opacity = 0.45;
shadow-offset-x = -12;
shadow-offset-y = -10;
shadow-color = "@@bg@@";

fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;
fade-delta = 6;

corner-radius = @@radius@@;
detect-rounded-corners = true;
detect-client-opacity = true;
use-damage = true;

# no shadows/rounding on bars, docks, menus, notifications and fullscreen windows
rules = (
  { match = "window_type = 'dock' || window_type = 'desktop'"; shadow = false; corner-radius = 0; },
  { match = "window_type = 'menu' || window_type = 'dropdown_menu' || window_type = 'popup_menu' || window_type = 'tooltip'"; shadow = false; },
  { match = "fullscreen"; corner-radius = 0; },
  { match = "class_g = 'Polybar' || class_g = 'Dunst' || class_g = 'Rofi'"; corner-radius = 0; shadow = false; }
);
