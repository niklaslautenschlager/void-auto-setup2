# @@name@@: MangoWC rice (void-postinstall)
# Generated by void-rice from palettes/@@rice@@.conf. Edit the palette (or
# ~/.config/void-rice/@@rice@@.conf) and run `void-rice apply @@rice@@`.
# Check after editing by hand: mango -c ~/.config/mango/config.conf -p

# ---- effects -------------------------------------------------------------
blur=1
blur_layer=1
blur_optimized=1
blur_params_num_passes=2
blur_params_radius=6
blur_params_noise=0.02
blur_params_brightness=0.9
blur_params_contrast=0.9
blur_params_saturation=1.2

shadows=1
layer_shadows=0
shadow_only_floating=0
shadows_size=14
shadows_blur=18
shadows_position_x=0
shadows_position_y=4
shadowscolor=0x00000099

border_radius=@@radius@@
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=0.96

# ---- animations ------------------------------------------------------------
animations=1
layer_animations=1
animation_type_open=zoom
animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.5
fadein_begin_opacity=0.5
fadeout_begin_opacity=0.8
animation_duration_move=400
animation_duration_open=350
animation_duration_tag=300
animation_duration_close=400
animation_curve_open=0.46,1.0,0.29,1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1

# ---- layouts -----------------------------------------------------------------
new_is_master=1
default_mfact=0.55
default_nmaster=1
smartgaps=0
scroller_default_proportion=0.8
scroller_proportion_preset=0.5,0.8,1.0
tagrule=id:1,layout_name:tile
tagrule=id:2,layout_name:tile
tagrule=id:3,layout_name:scroller
tagrule=id:4,layout_name:tile
tagrule=id:5,layout_name:tile
tagrule=id:6,layout_name:tile
tagrule=id:7,layout_name:tile
tagrule=id:8,layout_name:tile
tagrule=id:9,layout_name:monocle

# ---- behaviour ---------------------------------------------------------------
focus_on_activate=1
sloppyfocus=1
warpcursor=1
cursor_size=24

# ---- input -------------------------------------------------------------------
repeat_rate=40
repeat_delay=300
numlockon=1
xkb_rules_layout=@@kb_layout@@
tap_to_click=1
tap_and_drag=1
trackpad_natural_scrolling=1
trackpad_disable_while_typing=1

# ---- appearance --------------------------------------------------------------
gappih=@@gaps_in@@
gappiv=@@gaps_in@@
gappoh=@@gaps_out@@
gappov=@@gaps_out@@
borderpx=@@border@@
rootcolor=0x@@bg_hex@@ff
bordercolor=0x@@bg_hi_hex@@ff
focuscolor=0x@@accent_hex@@ff
urgentcolor=0x@@urgent_hex@@ff
maximizescreencolor=0x@@accent2_hex@@ff
scratchpadcolor=0x@@info_hex@@ff
globalcolor=0x@@c5_hex@@ff
overlaycolor=0x@@good_hex@@ff
dropcolor=0x@@accent_hex@@55
splitcolor=0x@@accent2_hex@@ff

# ---- session -------------------------------------------------------------------
# Waybar, mako, swaybg, swayidle, polkit agent, applets, D-Bus activation env.
# PipeWire is already running (void-session).
exec-once=rice autostart

# ---- keys (same layout in every void-postinstall rice) ----------------------------
bind=SUPER,Return,spawn,rice term
bind=SUPER,d,spawn,rice launch
bind=SUPER,space,spawn,rice launch
bind=SUPER,q,killclient
bind=SUPER,f,togglefullscreen
bind=SUPER+SHIFT,f,togglemaximizescreen
bind=SUPER,v,togglefloating
bind=SUPER,Escape,spawn,rice lock
bind=SUPER+SHIFT,Escape,spawn,rice power
bind=SUPER+SHIFT,r,reload_config
bind=SUPER,n,switch_layout
bind=SUPER,o,toggleoverview
bind=SUPER,Tab,focuslast
bind=SUPER,grave,toggle_scratchpad
bind=SUPER+SHIFT,grave,minimized
bind=NONE,Print,spawn,rice shot full
bind=SHIFT,Print,spawn,rice shot area

bind=SUPER,h,focusdir,left
bind=SUPER,l,focusdir,right
bind=SUPER,k,focusdir,up
bind=SUPER,j,focusdir,down
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down
bind=SUPER+SHIFT,h,exchange_client,left
bind=SUPER+SHIFT,l,exchange_client,right
bind=SUPER+SHIFT,k,exchange_client,up
bind=SUPER+SHIFT,j,exchange_client,down
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down
bind=SUPER+CTRL,h,setmfact,-0.05
bind=SUPER+CTRL,l,setmfact,+0.05
bind=SUPER+CTRL,k,incnmaster,+1
bind=SUPER+CTRL,j,incnmaster,-1

bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0
bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0

bind=SUPER+ALT,h,focusmon,left
bind=SUPER+ALT,l,focusmon,right
bind=SUPER+ALT+SHIFT,h,tagmon,left
bind=SUPER+ALT+SHIFT,l,tagmon,right

bindl=NONE,XF86AudioRaiseVolume,spawn,rice vol up
bindl=NONE,XF86AudioLowerVolume,spawn,rice vol down
bindl=NONE,XF86AudioMute,spawn,rice vol mute
bindl=NONE,XF86AudioMicMute,spawn,rice vol mic
bindl=NONE,XF86MonBrightnessUp,spawn,rice light up
bindl=NONE,XF86MonBrightnessDown,spawn,rice light down
bindl=NONE,XF86AudioPlay,spawn,playerctl play-pause
bindl=NONE,XF86AudioPause,spawn,playerctl play-pause
bindl=NONE,XF86AudioNext,spawn,playerctl next
bindl=NONE,XF86AudioPrev,spawn,playerctl previous

mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
mousebind=NONE,btn_middle,togglemaximizescreen,0
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client

gesturebind=none,right,4,viewprev_have_client
gesturebind=none,left,4,viewnext_have_client
gesturebind=none,up,4,enteroverview
gesturebind=none,down,4,leaveoverview

# ---- rules ---------------------------------------------------------------------------
windowrule=isfloating:1,appid:^(pavucontrol|org\.pulseaudio\.pavucontrol|nm-connection-editor|blueman-manager)$
layerrule=animation_type_open:zoom,layer_name:rofi
layerrule=animation_type_close:zoom,layer_name:rofi
