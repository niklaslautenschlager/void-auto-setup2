# @@name@@: hyprlock (generated by void-rice)
general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
}

background {
    monitor =
    path = @@rice_dir@@/wallpaper.jpg
    color = rgb(@@bg_hex@@)
    blur_passes = 3
    blur_size = 7
    brightness = 0.6
}

label {
    monitor =
    text = $TIME
    color = rgb(@@fg_hex@@)
    font_size = 96
    font_family = @@font_ui@@ Bold
    position = 0, 160
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgb(@@fg_dim_hex@@)
    font_size = 20
    font_family = @@font_ui@@
    position = 0, 70
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 56
    outline_thickness = @@border@@
    dots_size = 0.25
    dots_spacing = 0.3
    outer_color = rgb(@@accent_hex@@) rgb(@@accent2_hex@@) 45deg
    inner_color = rgba(@@bg_alt_hex@@e6)
    font_color = rgb(@@fg_hex@@)
    check_color = rgb(@@good_hex@@)
    fail_color = rgb(@@urgent_hex@@)
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    fade_on_empty = false
    placeholder_text = <span foreground="##@@fg_dim_hex@@">password</span>
    rounding = @@radius@@
    position = 0, -40
    halign = center
    valign = center
}
