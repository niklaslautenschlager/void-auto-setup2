# Spectrum: spectrwm config for the Spectrum rice.
modkey = Mod4
workspace_limit = 9
focus_mode = default
focus_close = previous
focus_close_wrap = 1
border_width = @@border@@
color_focus = @@accent_xcolor@@
color_unfocus = @@bg_hi_xcolor@@
color_urgent = @@urgent_xcolor@@
region_padding = @@gaps_out@@
tile_gap = @@gaps_in@@
bar_enabled = 1
bar_at_bottom = @@spectrwm_bar_bottom@@
bar_border_width = @@spectrwm_bar_border@@
bar_border[1] = @@bg_xcolor@@
bar_color[1] = @@bg_alt_xcolor@@
bar_color_selected[1] = @@accent_xcolor@@
bar_font_color[1] = @@fg_xcolor@@
bar_font = @@font_mono@@:pixelsize=@@font_px@@
bar_action = $HOME/.config/spectrwm/baraction.sh
bar_action_expand = 1
bar_justify = center
workspace_indicator = listcurrent,listactive,markcurrent,markurgent
clock_enabled = 0
window_class_enabled = 1
window_name_enabled = 0

program[term] = rice term
bind[term] = MOD+Return
program[menu] = rice launch
bind[menu] = MOD+d
program[launcher] = rice launch
bind[launcher] = MOD+space
program[lock] = rice lock
bind[lock] = MOD+Escape
program[power] = rice power
bind[power] = MOD+Shift+Escape
program[shot_full] = rice shot full
bind[shot_full] = Print
program[shot_area] = rice shot area
bind[shot_area] = Shift+Print
program[vol_up] = rice vol up
bind[vol_up] = XF86AudioRaiseVolume
program[vol_down] = rice vol down
bind[vol_down] = XF86AudioLowerVolume
program[vol_mute] = rice vol mute
bind[vol_mute] = XF86AudioMute
program[vol_mic] = rice vol mic
bind[vol_mic] = XF86AudioMicMute
program[light_up] = rice light up
bind[light_up] = XF86MonBrightnessUp
program[light_down] = rice light down
bind[light_down] = XF86MonBrightnessDown
program[playpause] = playerctl play-pause
bind[playpause] = XF86AudioPlay
program[next] = playerctl next
bind[next] = XF86AudioNext
program[previous] = playerctl previous
bind[previous] = XF86AudioPrev

bind[focus_prev] = MOD+h
bind[focus_prev] = MOD+Left
bind[focus_next] = MOD+j
bind[focus_next] = MOD+Down
bind[focus_prev] = MOD+k
bind[focus_prev] = MOD+Up
bind[focus_next] = MOD+l
bind[focus_next] = MOD+Right
bind[swap_prev] = MOD+Shift+h
bind[swap_prev] = MOD+Shift+Left
bind[swap_next] = MOD+Shift+j
bind[swap_next] = MOD+Shift+Down
bind[swap_prev] = MOD+Shift+k
bind[swap_prev] = MOD+Shift+Up
bind[swap_next] = MOD+Shift+l
bind[swap_next] = MOD+Shift+Right
bind[master_shrink] = MOD+Control+h
bind[master_shrink] = MOD+Control+Left
bind[height_shrink] = MOD+Control+j
bind[height_shrink] = MOD+Control+Down
bind[height_grow] = MOD+Control+k
bind[height_grow] = MOD+Control+Up
bind[master_grow] = MOD+Control+l
bind[master_grow] = MOD+Control+Right
bind[fullscreen_toggle] = MOD+f
bind[float_toggle] = MOD+v
bind[restart] = MOD+Shift+r
bind[wind_del] = MOD+q

bind[ws_1] = MOD+1
bind[ws_2] = MOD+2
bind[ws_3] = MOD+3
bind[ws_4] = MOD+4
bind[ws_5] = MOD+5
bind[ws_6] = MOD+6
bind[ws_7] = MOD+7
bind[ws_8] = MOD+8
bind[ws_9] = MOD+9
bind[mvws_1] = MOD+Shift+1
bind[mvws_2] = MOD+Shift+2
bind[mvws_3] = MOD+Shift+3
bind[mvws_4] = MOD+Shift+4
bind[mvws_5] = MOD+Shift+5
bind[mvws_6] = MOD+Shift+6
bind[mvws_7] = MOD+Shift+7
bind[mvws_8] = MOD+Shift+8
bind[mvws_9] = MOD+Shift+9
