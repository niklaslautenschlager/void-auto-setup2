# @@name@@: Aurora Wayfire setup. Colours come from palettes/@@rice@@.conf.

[core]
plugins = alpha animate autostart blur command decoration expo grid idle matcher move place resize scale simple-tile switcher vswitch wm-actions wobbly
close_top_view = <super> KEY_Q
auto_reload_config = true
vwidth = 3
vheight = 3
preferred_decoration_mode = client

[input]
xkb_layout = @@kb_layout@@
kb_repeat_rate = 40
kb_repeat_delay = 300
tap_to_click = true
natural_scroll = false

[decoration]
border_size = @@border@@
active_color = \@@accent@@ff
inactive_color = \@@bg_hi@@ff
title_height = 0

[simple-tile]
tile_by_default = all
button_move = <super> BTN_LEFT
button_resize = <super> BTN_RIGHT
key_toggle = <super> KEY_V
key_focus_left = <super> KEY_H
key_focus_below = <super> KEY_J
key_focus_above = <super> KEY_K
key_focus_right = <super> KEY_L
inner_gap_size = @@gaps_in@@
outer_horiz_gap_size = @@gaps_out@@
outer_vert_gap_size = @@gaps_out@@
keep_fullscreen_on_adjacent = true

[move]
activate = <super> BTN_LEFT

[resize]
activate = <super> BTN_RIGHT

[wm-actions]
toggle_fullscreen = <super> KEY_F
toggle_always_on_top = <super> KEY_T

[grid]
slot_l = <super> KEY_LEFT
slot_b = <super> KEY_DOWN
slot_t = <super> KEY_UP
slot_r = <super> KEY_RIGHT
restore = <super> <shift> KEY_SPACE

[vswitch]
binding_1 = <super> KEY_1
binding_2 = <super> KEY_2
binding_3 = <super> KEY_3
binding_4 = <super> KEY_4
binding_5 = <super> KEY_5
binding_6 = <super> KEY_6
binding_7 = <super> KEY_7
binding_8 = <super> KEY_8
binding_9 = <super> KEY_9
send_win_1 = <super> <shift> KEY_1
send_win_2 = <super> <shift> KEY_2
send_win_3 = <super> <shift> KEY_3
send_win_4 = <super> <shift> KEY_4
send_win_5 = <super> <shift> KEY_5
send_win_6 = <super> <shift> KEY_6
send_win_7 = <super> <shift> KEY_7
send_win_8 = <super> <shift> KEY_8
send_win_9 = <super> <shift> KEY_9

[expo]
toggle = <super> KEY_TAB

[scale]
toggle = <super> KEY_W

[command]
binding_terminal = <super> KEY_ENTER
command_terminal = rice term
binding_launch_d = <super> KEY_D
command_launch_d = rice launch
binding_launch_space = <super> KEY_SPACE
command_launch_space = rice launch
binding_lock = <super> KEY_ESC
command_lock = rice lock
binding_power = <super> <shift> KEY_ESC
command_power = rice power
binding_reload = <super> <shift> KEY_R
command_reload = touch "$HOME/.config/wayfire/wayfire.ini"
binding_shot = KEY_PRINT
command_shot = rice shot full
binding_shot_area = <shift> KEY_PRINT
command_shot_area = rice shot area
repeatable_binding_volume_up = KEY_VOLUMEUP
command_volume_up = rice vol up
repeatable_binding_volume_down = KEY_VOLUMEDOWN
command_volume_down = rice vol down
binding_volume_mute = KEY_MUTE
command_volume_mute = rice vol mute
binding_mic_mute = KEY_MICMUTE
command_mic_mute = rice vol mic
repeatable_binding_light_up = KEY_BRIGHTNESSUP
command_light_up = rice light up
repeatable_binding_light_down = KEY_BRIGHTNESSDOWN
command_light_down = rice light down
binding_media_play = KEY_PLAYPAUSE
command_media_play = playerctl play-pause
binding_media_next = KEY_NEXTSONG
command_media_next = playerctl next
binding_media_previous = KEY_PREVIOUSSONG
command_media_previous = playerctl previous

[autostart]
rice = rice autostart
autostart_wf_shell = false

[idle]
screensaver_timeout = -1
dpms_timeout = -1

[alpha]
min_value = 0.85
modifier = <super> <alt>

[blur]
toggle = <super> <shift> KEY_B
method = kawase
offset = 3
passes = 3

[animate]
open_animation = zoom
close_animation = zoom
duration = 180

[wobbly]
friction = 4.0
spring_k = 8.0
